name: Update dashboard data
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install icalendar recurring-ical-events
      - run: python scripts/fetch_data.py
        env:
          CAL_URL: ${{ secrets.CAL_URL }}
          ALBUM_URL: ${{ secrets.ALBUM_URL }}
      - name: Commit changes
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update data" && git push)